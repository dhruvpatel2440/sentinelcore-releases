# product.conf — product-level, build-time values baked into every release.
# KEY=VALUE only (parsed, never sourced). build-release.sh renders these into
# the package's lib/product.sh.
#
# RELAY_URL: public HTTPS base URL of the deployed SentinelCore email relay
# (relay/, see relay/DEPLOY.md). The build FAILS while this is still the
# placeholder below, unless --allow-placeholder-relay is passed (TEST BUILD).
RELAY_URL=https://relay.sentinelcore.app
