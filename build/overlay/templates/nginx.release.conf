# SentinelCore release nginx — serve the static frontend build, proxy /api
# to the backend. No Vite dev upstream (that was dev-only).

upstream backend_upstream {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # FastAPI backend. No trailing slash on proxy_pass so the /api prefix is
    # preserved (keeps the refresh cookie's path=/api/auth scoping correct).
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static SPA: serve the file if it exists, else fall back to index.html so
    # client-side routes resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
