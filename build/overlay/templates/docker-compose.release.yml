# SentinelCore release compose — base file (always used).
#
# Optional overlays, added with -f by the installer / systemd unit:
#   docker-compose.tls.yml    HTTPS port 443 + server certificate (TLS_MODE != http-local)
#   docker-compose.email.yml  relay-shim sidecar + CA bundle for the backend (email on)
# With email OFF nothing email-related is mounted or set.
#
# Differences from main's dev compose (overlay only, source untouched):
#   * no code bind mounts, no uvicorn --reload, no Vite: static frontend served by nginx
#   * images from the bundled tarball (pull_policy: never), tag = package VERSION
#   * healthchecks on every service; docker log rotation on every service
#   * web UI published on ${BIND_ADDRESS}:${HTTP_PORT} (and :${HTTPS_PORT} via the TLS overlay)
# __VERSION__ is substituted by the installer from the package VERSION file.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  sentinelcore-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  helper_socket:
  rule_staging:
  suricata_rules:
  suricata_logs:
  suricata_run:
  report_storage:
  pcap_storage:

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only (host tooling, backups). Never exposed off-box.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging
    networks:
      - sentinelcore-network

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging
    networks:
      - sentinelcore-network

  # Privilege boundary: root with a 4-capability allowlist, never privileged.
  helper:
    image: sentinelcore/helper:__VERSION__
    pull_policy: never
    env_file: .env
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
      - CHOWN
    volumes:
      - helper_socket:/run/sentinelcore
      - suricata_rules:/var/lib/suricata/rules
      - rule_staging:/var/lib/sentinelcore/staging
      - suricata_logs:/var/log/suricata
      - suricata_run:/var/run/suricata
      - ./suricata.yaml:/etc/suricata/suricata.yaml:ro
    # Healthy = socket bound AND the helper server is PID 1.
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/sentinelcore/helper.sock && grep -q helper.server /proc/1/cmdline"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    logging: *logging
    network_mode: host

  backend:
    image: sentinelcore/backend:__VERSION__
    pull_policy: never
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      HELPER_SOCKET_PATH: /run/sentinelcore/helper.sock
    # Main's command minus --reload (the app reads X-Forwarded-For itself).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - helper_socket:/run/sentinelcore
      - rule_staging:/var/lib/sentinelcore/staging
      - suricata_logs:/var/log/suricata:ro
      - report_storage:/var/lib/sentinelcore/reports
      - pcap_storage:/var/lib/sentinelcore/pcap
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks:
      - sentinelcore-network

  worker:
    image: sentinelcore/backend:__VERSION__
    pull_policy: never
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "false"
      HELPER_SOCKET_PATH: /run/sentinelcore/helper.sock
    command: ["python", "-m", "app.pipeline.worker"]
    volumes:
      - suricata_logs:/var/log/suricata:ro
      - report_storage:/var/lib/sentinelcore/reports
      - pcap_storage:/var/lib/sentinelcore/pcap
      - helper_socket:/run/sentinelcore
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The entrypoint execs the worker, so it is PID 1 (no procps in the image).
    healthcheck:
      test: ["CMD-SHELL", "grep -q app.pipeline.worker /proc/1/cmdline"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks:
      - sentinelcore-network

  nginx:
    image: nginx:1.27-alpine
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-dist:/usr/share/nginx/html:ro
    ports:
      # TLS on: this port only redirects to HTTPS. TLS_MODE=http-local: the UI (loopback only).
      - "${BIND_ADDRESS:?BIND_ADDRESS must be set in .env}:${HTTP_PORT:?HTTP_PORT must be set in .env}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *logging
    networks:
      - sentinelcore-network
