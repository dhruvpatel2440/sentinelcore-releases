# Sample non-interactive install config (test values only). KEY=VALUE, an
# allowlist of keys; nothing is executed. chmod 600 — it holds a password.
#   sudo ./install.sh --non-interactive --config sample-install.conf
ADMIN_EMAIL=admin@example.org
ADMIN_USERNAME=admin
ADMIN_PASSWORD='Te$t-Pa'ss "Word" 2026'
MONITORED_NETWORK=10.20.0.0/24
PROTECTED_IPS=10.20.0.1,10.20.0.2,10.20.0.10
CAPTURE_INTERFACE=enp0s8
# self-signed (default) | custom (+ TLS_CERT_FILE / TLS_KEY_FILE) | http-local (127.0.0.1 only)
TLS_MODE=self-signed
BIND_ADDRESS=0.0.0.0
HTTP_PORT=8080
HTTPS_PORT=8443
APP_BASE_URL=https://10.20.0.10:8443
TIMEZONE=UTC
EMAIL_MODE=brevo
# yes = refresh ET Open rules from the internet during install (default: no)
UPDATE_RULES=no
# yes = nightly backup timer (02:30, keeps 7)
NIGHTLY_BACKUP=no
